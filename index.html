    <script>

        // =========================
        // LOGIN
        // =========================

        async function login() {

            const phone =
                document.getElementById("phone").value;

            const password =
                document.getElementById("password").value;

            const result =
                document.getElementById("result");

            result.textContent = "Logging in...";

            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        phone: phone,
                        password: password
                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    result.textContent =
                        data.detail || "Login failed.";

                    return;
                }

                localStorage.setItem(
                    "access_token",
                    data.access_token
                );

                result.textContent =
                    "Login successful!";

            const profileResponse = await fetch("/me", {
    headers: {
        "Authorization": `Bearer ${data.access_token}`
    }
});

const profile = await profileResponse.json();

if (!profileResponse.ok) {
    result.textContent = "Unable to load your profile.";
    return;
}

showDashboard(profile);

            } catch (error) {

                result.textContent =
                    "Unable to connect to the server.";

                console.error(error);
            }
        }
        // =========================
        // PAYSTACK PAYMENT RETURN
        // =========================

        async function verifyPaymentOnReturn() {

            const params =
                new URLSearchParams(window.location.search);

            const reference =
                params.get("reference");

            if (!reference) {
                return;
            }

            const token =
                localStorage.getItem("access_token");

            if (!token) {
                return;
            }

            try {

                const response = await fetch(
                    "/paystack/verify/" +
                    encodeURIComponent(reference),
                    {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    console.error(
                        "Payment verification failed:",
                        data
                    );
                    return;
                }

                if (data.status === "success") {

                    alert(
                        "Payment successful! Your wallet has been credited."
                    );

                    window.history.replaceState(
                        {},
                        document.title,
                        window.location.pathname
                    );

                    showWallet();
                }

            } catch (error) {

                console.error(
                    "Unable to verify payment:",
                    error
                );
            }
        }

async function loadProfile() {
    const message = document.getElementById("profileMessage");
    const token = localStorage.getItem("access_token");

    if (!token) {
        message.textContent = "Please log in again.";
        return;
    }

    message.textContent = "Loading profile...";

    try {
        const response = await fetch("/me", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.detail || "Unable to load profile.";
            return;
        }

        document.getElementById("profileName").value = data.name || "";
        document.getElementById("profileEmail").value = data.email || "";
        document.getElementById("profilePhone").value = data.phone || "";

        message.textContent = "";
    } catch (error) {
        message.textContent = "Unable to connect to the server.";
        console.error(error);
    }
}

async function updateProfile() {
    const message = document.getElementById("profileMessage");
    const token = localStorage.getItem("access_token");

    if (!token) {
        message.textContent = "Please log in again.";
        return;
    }

    const name = document.getElementById("profileName").value.trim();
    const email = document.getElementById("profileEmail").value.trim();
    const phone = document.getElementById("profilePhone").value.trim();

    if (name.length < 2 || !email || phone.length < 10 || phone.length > 20) {
        message.textContent = "Please enter a valid name, email, and phone number.";
        return;
    }

    message.textContent = "Saving profile...";

    try {
        const response = await fetch("/profile", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ name, email, phone })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.detail || "Unable to update profile.";
            return;
        }

        document.getElementById("welcomeMessage").textContent =
            "Welcome, " + name + "!";

        message.textContent = "Profile updated successfully.";
    } catch (error) {
        message.textContent = "Unable to connect to the server.";
        console.error(error);
    }
}


async function showWallet() {


    document.getElementById("walletCard").classList.remove("hidden");

    const balance = document.getElementById("walletBalance");

    const token = localStorage.getItem("access_token");

    if (!token) {

    try {
        const response = await fetch("/wallet", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            balance.textContent = data.detail || "Unable to load wallet.";

        balance.textContent =
            "Balance: ₦" + Number(data.balance).toFixed(2);

    } catch (error) {
        balance.textContent = "Unable to connect to the server.";
        console.error(error);
    }
}

async function fundWallet() {

    const amount = prompt("Enter amount to fund:");

    if (!amount) {
        return;
    }

    const numericAmount = Number(amount);

    if (!Number.isFinite(numericAmount) || numericAmount <= 0) {
        alert("Please enter a valid amount.");
        return;
    }

    const token = localStorage.getItem("access_token");

    if (!token) {
        alert("Please log in again.");
        return;
    }

    try {

        const response = await fetch("/paystack/initialize", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
                amount: numericAmount
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Unable to initialize payment.");
            return;
        }

        window.location.href = data.authorization_url;

    } catch (error) {

        alert("Unable to connect to the server.");
        console.error(error);

    }
}

        ],
        "9mobile": [

        ]
    };

    for (const [network, prefixes] of Object.entries(networkPrefixes)) {

async function signup() {
    const name = document.getElementById("signupName").value;
    const phone = document.getElementById("signupPhone").value;
    const password = document.getElementById("signupPassword").value;
    const result = document.getElementById("signupResult");

    result.textContent = "Creating account...";

    try {
        const response = await fetch("/user", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                phone: phone,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.detail || "Account creation failed.";
            return;
        }

        result.textContent = "Account created successfully!";
    } catch (error) {
        result.textContent = "Unable to connect to the server.";
        console.error(error);
    }
}

async function loadTransactions() {
    const section = document.getElementById("transactions-section");

    section.innerHTML = "";
    section.textContent = "Loading transactions...";

    try {
        const response = await fetch("/transactions", {
            headers: {
                "Authorization":
                    "Bearer " + localStorage.getItem("access_token")
            }
        });

        if (!response.ok) {
            throw new Error("Could not load transactions.");
        }

        const data = await response.json();
        const transactions = data.transactions || [];

        section.replaceChildren();

        const wrapper = document.createElement("div");
        wrapper.className = "transaction-panel";
        document.getElementById("backFromTransactions").classList.remove("hidden");
        const heading = document.createElement("h2");
        heading.textContent = "Transaction History";
        wrapper.appendChild(heading);

        const subtitle = document.createElement("p");
        subtitle.className = "transaction-subtitle";
        subtitle.textContent = "View your recent wallet transactions.";
        wrapper.appendChild(subtitle);

        const count = document.createElement("p");
        count.className = "transaction-count";
        count.textContent = transactions.length + " transaction(s)";
        wrapper.appendChild(count);

        if (transactions.length === 0) {
            const empty = document.createElement("p");
            empty.className = "transaction-empty";
            empty.textContent = "No transactions found yet.";
            wrapper.appendChild(empty);
            section.appendChild(wrapper);
            return;
        }

        const tableWrapper = document.createElement("div");
        tableWrapper.className = "transaction-table-wrapper";

        const table = document.createElement("table");
        table.className = "transaction-table";

        const thead = document.createElement("thead");
        const headerRow = document.createElement("tr");

        ["Transaction", "Type", "Amount", "Status", "Reference"]
            .forEach(function (label) {
                const th = document.createElement("th");
                th.textContent = label;
                headerRow.appendChild(th);
            });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        transactions.forEach(function (transaction) {
            const row = document.createElement("tr");

            const idCell = document.createElement("td");
            idCell.textContent =
                "#" + transaction.transaction_id;
            row.appendChild(idCell);

            const typeCell = document.createElement("td");
            typeCell.textContent =
                transaction.transaction_type || "N/A";
            row.appendChild(typeCell);

            const amountCell = document.createElement("td");
            amountCell.className = "transaction-amount";
            amountCell.textContent = Number(transaction.amount)
                .toLocaleString("en-NG", {
                    style: "currency",
                    currency: "NGN"
                });
            row.appendChild(amountCell);

            const statusCell = document.createElement("td");
            const status = document.createElement("span");
            const statusText = String(
                transaction.status || "unknown"
            );

            status.className = "transaction-status " +
                (statusText.toLowerCase() === "success"
                    ? "status-success"
                    : "status-other");

            status.textContent = statusText;
            statusCell.appendChild(status);
            row.appendChild(statusCell);

            const referenceCell = document.createElement("td");
            referenceCell.className = "transaction-reference";
            referenceCell.textContent =
                transaction.reference || "N/A";
            row.appendChild(referenceCell);

            tbody.appendChild(row);
        });

        table.appendChild(tbody);
        tableWrapper.appendChild(table);
        wrapper.appendChild(tableWrapper);
        section.appendChild(wrapper);

    } catch (error) {
        section.textContent =
            "Unable to load transactions. Please try again.";
        console.error("Transaction history error:", error);
    }
}
