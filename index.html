<!DOCTYPE html>
<html>
<head>
    <title>Customer Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Customer Management System</h1>

        <div class="card">

            <h2>Add Customer</h2>

            <label for="name">Customer Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter customer name"
            >

            <label for="service">Service</label>

            <input
                type="text"
                id="service"
                placeholder="Enter service requested"
            >

            <button onclick="sendCustomer()">
                Add Customer
            </button>

            <p id="result"></p>

        </div>


        <div class="card">

            <h2>Customers</h2>

            <input
                type="text"
                id="search"
                placeholder="Search customer by name..."
                onkeyup="searchCustomers()"
            >

            <table>

                <thead>
                    <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Service</th>
    <th>Action</th>
</tr>
                </thead>

                <tbody id="customerTable">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        async function sendCustomer() {

            const name =
                document.getElementById("name").value.trim();

            const service =
                document.getElementById("service").value.trim();


            if (name === "" || service === "") {

                document.getElementById("result").textContent =
                    "Please enter both customer name and service.";

                return;
            }


            const response = await fetch(
                `http://127.0.0.1:8000/customer?name=${encodeURIComponent(name)}&service=${encodeURIComponent(service)}`,
                {
                    method: "POST"
                }
            );


            const data = await response.json();


            document.getElementById("result").textContent =
                "Customer added successfully.";


            document.getElementById("name").value = "";

            document.getElementById("service").value = "";


            loadCustomers();

        }


        async function loadCustomers() {

            const response = await fetch(
                "http://127.0.0.1:8000/customers"
            );


            const customers = await response.json();


            const table =
                document.getElementById("customerTable");


            table.innerHTML = "";


            customers.forEach(function(customer) {

                const row = `
    <tr>
        <td>${customer.id}</td>
        <td>${customer.name}</td>
        <td>${customer.service}</td>
        <td>
    <button onclick="editCustomer(${customer.id})">
        Edit
    </button>

    <button onclick="deleteCustomer(${customer.id})">
        Delete
    </button>
</td>
    </tr>
`;

                table.innerHTML += row;

            });

        }


        function searchCustomers() {

            const search =
                document.getElementById("search").value.toLowerCase();


            const rows =
                document.querySelectorAll("#customerTable tr");


            rows.forEach(function(row) {

                const name =
                    row.children[1].textContent.toLowerCase();


                if (name.includes(search)) {

                    row.style.display = "";

                } else {

                    row.style.display = "none";

                }

            });

        }

        async function editCustomer(id) {

            const name = prompt("Enter new customer name:");

            if (name === null) {
                return;
            }

            const service = prompt("Enter new service:");

            if (service === null) {
                return;
            }

            if (name.trim() === "" || service.trim() === "") {
                alert("Name and service cannot be empty.");
                return;
            }

            const response = await fetch(
                `http://127.0.0.1:8000/customer/${id}?name=${encodeURIComponent(name.trim())}&service=${encodeURIComponent(service.trim())}`,
                {
                    method: "PUT"
                }
            );

            const data = await response.json();

            alert(data.message);

            loadCustomers();
        }


        function searchCustomers() {

            const search =
                document.getElementById("search").value.toLowerCase();

            const rows =
                document.querySelectorAll("#customerTable tr");

            rows.forEach(function(row) {

                const name =
                    row.children[1].textContent.toLowerCase();

                if (name.includes(search)) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }

            });

        }
async function deleteCustomer(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this customer?"
    );

    if (!confirmDelete) {
        return;
    }

    const response = await fetch(
        `http://127.0.0.1:8000/customer/${id}`,
        {
            method: "DELETE"
        }
    );

    const data = await response.json();

    alert(data.message);

    loadCustomers();
}

        loadCustomers();

    </script>

</body>
</html>
