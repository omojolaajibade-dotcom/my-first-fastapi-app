    <main class="card">
        <div class="icon">⏳</div>
        <h1>Payment Status</h1>
        <p id="message">
            Your payment has been submitted for verification.
        </p>
        <div class="status" id="status">Checking payment status...</div>
        <p id="reference"></p>

            Return to Omotech
        </button>
    </main>

html
<script>
    const params = new URLSearchParams(window.location.search);
    const reference = params.get("reference") || params.get("trxref");

    const statusElement = document.getElementById("status");
    const messageElement = document.getElementById("message");
    const iconElement = document.querySelector(".icon");

    if (!reference) {
        statusElement.textContent = "Payment reference not found.";
        messageElement.textContent =
            "Return to Omotech and check your transaction history.";
    } else {
        document.getElementById("reference").textContent =
            "Reference: " + reference;

        async function verifyPayment() {
            const token = localStorage.getItem("access_token");

            if (!token) {
                statusElement.textContent = "Login required";
                messageElement.textContent =
                    "Please return to Omotech and log in to check your payment.";
                return;
            }

            try {
                const response = await fetch(
                    "/paystack/verify/" + encodeURIComponent(reference),
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    statusElement.textContent = "Unable to verify payment";
                    messageElement.textContent =
                        data.detail || "Please check your transaction history.";
                    return;
                }

                if (data.status === "success") {
                    iconElement.textContent = "✅";
                    statusElement.textContent = "Payment confirmed";
                    messageElement.textContent =
                        "Your payment has been verified. Check your wallet balance.";
                } else {
                    statusElement.textContent =
                        data.status || "Processing";
                    messageElement.textContent =
                        data.message || "Your payment is not yet confirmed.";
                }
            } catch (error) {
                statusElement.textContent = "Verification unavailable";
                messageElement.textContent =
                    "Please check your transaction history and try again.";
                console.error(error);
            }
        }

        verifyPayment();
    }
</script>

</body>
</html>
